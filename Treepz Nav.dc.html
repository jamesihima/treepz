<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:16px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 16px;pointer-events:none;transition:transform .8s cubic-bezier(.22,1,.36,1);transform:{{ navTransform }};">
  <nav onMouseLeave="{{ leave }}" onMouseEnter="{{ keep }}" style="pointer-events:auto;position:relative;display:flex;align-items:center;gap:24px;padding:8px 8px 8px 22px;border-radius:999px;background:{{ bg }};border:1px solid {{ border }};backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);color:{{ fg }};transition:background .6s,color .6s,border-color .6s;max-width:1100px;width:100%;justify-content:space-between;">
    <a href="index.html" style="display:flex;align-items:center;color:inherit;">
      <img src="{{ logo }}" alt="Treepz" style="height:22px;display:block;">
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:24px;font-size:14px;font-weight:500;">
        <button onMouseEnter="{{ openProducts }}" onClick="{{ openProducts }}" style="background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:6px;">Products <span style="font-size:10px;opacity:.7;">▾</span></button>
        <a href="index.html#who" onMouseEnter="{{ closeNow }}" style="padding:6px 0;">Who it's for</a>
        <a href="problem-we-solve.html" onMouseEnter="{{ closeNow }}" style="padding:6px 0;">The problem we solve</a>
        <button onMouseEnter="{{ openCompany }}" onClick="{{ openCompany }}" style="background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:6px;">Company <span style="font-size:10px;opacity:.7;">▾</span></button>
      </div>
      <a href="book-a-demo.html" style="font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;background:#FFC044;color:#0A0A0A;" style-hover="background:#ffcf6b;color:#0A0A0A;">Book a demo</a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="book-a-demo.html" style="font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;background:#FFC044;color:#0A0A0A;">Book a demo</a>
        <button onClick="{{ toggleMobile }}" aria-label="Menu" style="width:44px;height:44px;border-radius:999px;border:1px solid {{ border }};background:none;color:inherit;font-size:18px;cursor:pointer;">≡</button>
      </div>
    </sc-if>

    <sc-if value="{{ showProducts }}" hint-placeholder-val="{{ false }}">
      <div onMouseEnter="{{ keep }}" onMouseLeave="{{ leave }}" style="position:absolute;top:100%;left:0;right:0;padding-top:12px;">
        <div style="background:rgba(14,14,14,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;box-shadow:0 30px 80px rgba(0,0,0,.35);">
          <sc-for list="{{ products }}" as="pr" hint-placeholder-count="6">
            <a href="book-a-demo.html?product={{ pr.slug }}" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;color:#fff;border:1px solid transparent;transition:background .5s,border-color .5s;" style-hover="background:rgba(255,255,255,.05);border-color:rgba(255,192,68,.35);color:#fff;">
              <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:#FFC044;">{{ pr.n }} · {{ pr.group }}</span>
              <span style="font-family:'General Sans',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;">{{ pr.name }}</span>
              <span style="font-size:13px;line-height:1.45;color:#B8B8B4;">{{ pr.line }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ showCompany }}" hint-placeholder-val="{{ false }}">
      <div onMouseEnter="{{ keep }}" onMouseLeave="{{ leave }}" style="position:absolute;top:100%;right:120px;width:min(560px,100%);padding-top:12px;">
        <div style="background:rgba(14,14,14,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;box-shadow:0 30px 80px rgba(0,0,0,.35);">
          <sc-for list="{{ company }}" as="c" hint-placeholder-count="4">
            <a href="{{ c.href }}" target="{{ c.target }}" style="display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:14px;color:#fff;border:1px solid transparent;transition:background .5s,border-color .5s;" style-hover="background:rgba(255,255,255,.05);border-color:rgba(255,192,68,.35);color:#fff;">
              <span style="font-family:'General Sans',sans-serif;font-weight:600;font-size:17px;">{{ c.name }}</span>
              <span style="font-size:13px;line-height:1.45;color:#B8B8B4;">{{ c.line }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </nav>
</header>

<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:#0A0A0A;color:#fff;padding:24px;display:flex;flex-direction:column;gap:6px;overflow:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <img src="assets/site/logo-white.png" alt="Treepz" style="height:22px;">
      <button onClick="{{ toggleMobile }}" aria-label="Close menu" style="width:44px;height:44px;border-radius:999px;border:1px solid #2A2A2A;background:none;color:#fff;font-size:18px;">✕</button>
    </div>
    <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:#FFC044;">PRODUCTS</span>
    <sc-for list="{{ products }}" as="pr" hint-placeholder-count="6">
      <a href="book-a-demo.html?product={{ pr.slug }}" style="font-family:'General Sans',sans-serif;font-size:20px;font-weight:500;padding:10px 0;border-bottom:1px solid #1E1E1E;color:#fff;">{{ pr.name }}</a>
    </sc-for>
    <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:#FFC044;margin-top:20px;">COMPANY</span>
    <sc-for list="{{ company }}" as="c" hint-placeholder-count="4">
      <a href="{{ c.href }}" target="{{ c.target }}" style="font-family:'General Sans',sans-serif;font-size:20px;font-weight:500;padding:10px 0;border-bottom:1px solid #1E1E1E;color:#fff;">{{ c.name }}</a>
    </sc-for>
    <a href="index.html#who" onClick="{{ toggleMobile }}" style="font-family:'General Sans',sans-serif;font-size:20px;font-weight:500;padding:10px 0;margin-top:20px;color:#fff;">Who it's for</a>
    <a href="problem-we-solve.html" style="font-family:'General Sans',sans-serif;font-size:20px;font-weight:500;padding:10px 0;color:#fff;">The problem we solve</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;hidden&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null, mobile: false, mobileOpen: false };
  products = [
    { n: '01', group: 'PARKS', slug: 'parks', name: 'Parks and Terminals', line: 'Ticketing, payment and records for a park or terminal, end to end.' },
    { n: '02', group: 'CAMPUSES', slug: 'campus', name: 'Campus Commute', line: 'Shuttles timed around lectures, with no cash at the stop.' },
    { n: '03', group: 'SCHOOLS', slug: 'school', name: 'School Run', line: 'Scheduled school buses, with trip records the school and parents can see.' },
    { n: '04', group: 'COMPANIES', slug: 'staff', name: 'Staff Bus Solution', line: 'Scheduled staff buses, with a clear record of every trip and its cost.' },
    { n: '05', group: 'RIDERS', slug: 'rideshare', name: 'Ride Share', line: 'Schedule the daily commute, pay cashless, earn points toward free rides.' },
    { n: '06', group: 'CITIES', slug: 'interstate', name: 'Interstate Travel', line: 'Book seats between cities ahead, pay cashless, see every booking.' },
  ];
  company = [
    { name: 'About us', line: 'Who we are, where we operate and the team behind Treepz.', href: 'about.html', target: '_self' },
    { name: 'Careers', line: 'Open roles across our teams.', href: 'https://treepz.notion.site/Open-Positions-at-Treepz-Global-1cf36abc474280d7ac3ee66442ac824b', target: '_blank' },
    { name: 'Blog', line: 'Stories from the parks, campuses and roads we move.', href: 'blog.html?cat=stories', target: '_self' },
    { name: 'Newsroom', line: 'Announcements and Treepz in the press.', href: 'blog.html?cat=news', target: '_self' },
  ];
  componentDidMount() { addEventListener('resize', this.onResize); this.onResize(); }
  componentWillUnmount() { removeEventListener('resize', this.onResize); clearTimeout(this.t); }
  onResize = () => { const m = innerWidth < 1000; if (m !== this.state.mobile) this.setState({ mobile: m }); };
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark', o = this.state.open;
    return {
      bg: dark ? 'rgba(18,18,18,.5)' : 'rgba(255,255,255,.78)', fg: dark ? '#fff' : '#0A0A0A', border: dark ? 'rgba(255,255,255,.14)' : 'rgba(10,10,10,.1)',
      logo: dark ? 'assets/site/logo-white.png' : 'assets/site/logo-full.png',
      navTransform: this.props.hidden && !o ? 'translateY(-120px)' : 'translateY(0)',
      desktop: !this.state.mobile, mobile: this.state.mobile, mobileOpen: this.state.mobileOpen,
      products: this.products, company: this.company,
      showProducts: o === 'products' && !this.state.mobile, showCompany: o === 'company' && !this.state.mobile,
      openProducts: () => { clearTimeout(this.t); this.setState({ open: 'products' }); },
      openCompany: () => { clearTimeout(this.t); this.setState({ open: 'company' }); },
      closeNow: () => { clearTimeout(this.t); this.setState({ open: null }); },
      keep: () => clearTimeout(this.t),
      leave: () => { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ open: null }), 220); },
      toggleMobile: () => this.setState((s) => ({ mobileOpen: !s.mobileOpen })),
    };
  }
}
</script>
</body>
</html>
